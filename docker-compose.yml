services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: sipadu_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - db
      - redis
    networks:
      - sipadu

  web:
    image: nginx:alpine
    container_name: sipadu_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:cached
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sipadu

  db:
    image: mysql:8.0
    container_name: sipadu_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sipadu
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    volumes:
      - sipadu_dbdata:/var/lib/mysql
    networks:
      - sipadu

  redis:
    image: redis:alpine
    container_name: sipadu_redis
    ports:
      - "6380:6379"
    networks:
      - sipadu

networks:
  sipadu:
    driver: bridge

volumes:
  sipadu_dbdata:
